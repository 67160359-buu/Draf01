<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyFlow — Flight Search Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/90 backdrop-blur-md border border-sky-100 rounded-3xl p-8 shadow-2xl">
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white text-3xl mx-auto shadow-lg shadow-sky-200 mb-3 transform hover:scale-105 transition duration-300">
                ✈️
            </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">SkyFlow</h1>
            <p class="text-xs text-slate-500 mt-1.5 font-medium">ค้นหาและเปรียบเทียบเที่ยวบินราคาประหยัด</p>
        </div>

        <!-- Alert Notification -->
        <div id="alertBox" class="hidden p-3.5 rounded-2xl text-xs font-semibold mb-5 text-center transition-all duration-300"></div>

        <!-- Tab Switcher -->
        <div class="flex bg-slate-100/80 p-1.5 rounded-2xl mb-6 text-xs font-bold border border-slate-200/50">
            <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-xl bg-white shadow-sm text-sky-600 transition-all duration-200">เข้าสู่ระบบ</button>
            <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2.5 rounded-xl text-slate-500 transition-all duration-200 hover:text-slate-700">สมัครสมาชิก</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Username หรือ E-mail</label>
                <input type="text" id="loginUsername" placeholder="กรอก Username หรือ อีเมล" required class="w-full bg-slate-50/50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full bg-slate-50/50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 focus:bg-white transition">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-200 hover:shadow-sky-300 transition-all duration-200 text-sm cursor-pointer mt-2">
                เข้าสู่ระบบ ➔
            </button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">ชื่อ-นามสกุล</label>
                <input type="text" id="regName" placeholder="สมชาย ใจดี" required class="w-full bg-slate-50/50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                <input type="text" id="regUsername" onblur="checkUsernameAvailability()" placeholder="ตั้งชื่อผู้ใช้" required class="w-full bg-slate-50/50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 focus:bg-white transition">
                <span id="userCheckMsg" class="text-[11px] mt-1 block"></span>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">E-mail</label>
                <input type="email" id="regEmail" onblur="checkEmailAvailability()" placeholder="example@domain.com" required class="w-full bg-slate-50/50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 focus:bg-white transition">
                <span id="emailCheckMsg" class="text-[11px] mt-1 block"></span>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" id="regPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required class="w-full bg-slate-50/50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 focus:bg-white transition">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-200 hover:shadow-emerald-300 transition-all duration-200 text-sm cursor-pointer mt-2">
                ยืนยันการสมัครสมาชิก
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-[11px] text-slate-400">© SkyFlow Flight Search Portal. All rights reserved.</p>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
            
            const activeClass = "flex-1 py-2.5 rounded-xl bg-white shadow-sm text-sky-600 transition-all duration-200";
            const inactiveClass = "flex-1 py-2.5 rounded-xl text-slate-500 transition-all duration-200 hover:text-slate-700";
            
            document.getElementById('tabLogin').className = isLogin ? activeClass : inactiveClass;
            document.getElementById('tabRegister').className = !isLogin ? activeClass : inactiveClass;
        }

        function showAlert(msg, isError = false) {
            const box = document.getElementById('alertBox');
            box.className = `p-3.5 rounded-2xl text-xs font-semibold mb-5 text-center ${
                isError 
                ? 'bg-rose-50 text-rose-600 border border-rose-200/60' 
                : 'bg-emerald-50 text-emerald-600 border border-emerald-200/60'
            }`;
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        async function checkUsernameAvailability() {
            const username = document.getElementById('regUsername').value.trim();
            if (!username) return;
            try {
                const res = await fetch(`/check-username/${username}`);
                const data = await res.json();
                const msg = document.getElementById('userCheckMsg');
                if (data.available) {
                    msg.className = "text-[11px] text-emerald-600 font-semibold mt-1 block";
                    msg.innerText = "✓ Username นี้สามารถใช้ได้";
                } else {
                    msg.className = "text-[11px] text-rose-500 font-semibold mt-1 block";
                    msg.innerText = "✕ Username นี้ถูกใช้งานแล้ว";
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function checkEmailAvailability() {
            const email = document.getElementById('regEmail').value.trim();
            if (!email) return;
            try {
                const res = await fetch(`/check-email/${encodeURIComponent(email)}`);
                const data = await res.json();
                const msg = document.getElementById('emailCheckMsg');
                if (data.available) {
                    msg.className = "text-[11px] text-emerald-600 font-semibold mt-1 block";
                    msg.innerText = "✓ Email นี้สามารถใช้ได้";
                } else {
                    msg.className = "text-[11px] text-rose-500 font-semibold mt-1 block";
                    msg.innerText = "✕ Email นี้ถูกใช้งานแล้ว";
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    showAlert('เข้าสู่ระบบสำเร็จ! กำลังนำคุณไปยังระบบ SkyFlow...');
                    setTimeout(() => window.location.href = '/flight.html', 1000);
                } else {
                    showAlert(data.message || 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ', true);
                }
            } catch (err) {
                showAlert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้', true);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('regName').value,
                        username: document.getElementById('regUsername').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
                    switchTab('login');
                } else {
                    showAlert(data.message || 'เกิดข้อผิดพลาดในการสมัครสมาชิก', true);
                }
            } catch (err) {
                showAlert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้', true);
            }
        }
    </script>
</body>
</html>
